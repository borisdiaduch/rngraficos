<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elecciones en Brasil 2026: resultados presidenciales</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;600;700;800&family=Fira+Sans:wght@400;500;600;700;800;900&display=swap');
  .rn-br *{ box-sizing:border-box; }
  .rn-br{
    --bg:#f4f2ec;
    --panel:#ffffff;
    --border:#dedad0;
    --text:#2b2a25;
    --muted:#7a7669;
    --black:#141414;
    --gray-hover:#3f3e3a;
    --gray-hover-bg:#eeeeec;
    --gray-selected-bg:#e3e3e0;
    --gray-focus:#8f8c82;
    --nodata:#e6e3da;
    --error:#b3261e;
    --num:'Fira Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-family:'Chivo', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .rn-br{ padding:20px 14px 26px; }
  .rn-br [hidden]{ display:none !important; }
  .rn-card{ max-width:600px; margin:0 auto; background:var(--panel); }

  /* ---------- encabezado ---------- */
  .rn-head{ text-align:center; }
  .rn-head h1{ margin:0; font-size:28px; line-height:1.1; font-weight:800; letter-spacing:-0.01em; text-wrap:balance; }
  .rn-dek{ margin:6px auto 0; max-width:30em; font-size:15px; line-height:1.4; color:var(--text); text-wrap:balance; }
  .rn-rule{ height:0; border:0; border-top:1px solid var(--black); margin:14px auto 12px; }
  .sc{ font-variant-caps:all-small-caps; letter-spacing:.03em; }

  /* ---------- totales ---------- */
  .rn-totals{ display:flex; flex-wrap:wrap; justify-content:center; gap:4px 25px; margin:0; font-size:17px; }
  .rn-totals > div{ display:flex; align-items:baseline; gap:6px; }
  .rn-totals dt{ font-weight:500; font-variant-caps:all-small-caps; letter-spacing:.03em; }
  .rn-totals dd{ margin:0; font-weight:800; font-variant-numeric:tabular-nums; }
  .rn-status{ margin:4px 0 0; text-align:center; font-size:11.5px; color:var(--muted); }
  .rn-status.is-stale{ color:#9a5b00; }
  .rn-alert{ margin:10px 0 0; padding:10px 12px; border:1px solid var(--error); border-radius:6px; color:var(--error); font-size:12.5px; line-height:1.4; }
  .rn-alert[hidden]{ display:none; }

  /* ---------- cara a cara ---------- */
  .rn-duel{ display:flex; justify-content:center; gap:20px; padding:16px 0 4px; }
  .rn-rival{ display:flex; align-items:center; gap:12px; min-width:0; }
  .rn-photo{ flex:none; width:96px; height:96px; border-radius:50%; overflow:hidden; position:relative; }
  .rn-photo img{ position:absolute; left:50%; width:var(--w, 88%); height:auto; display:block; transform:translateX(calc(-50% + var(--x, 0%))); }
  .rn-rival-name{ margin:0; font-family:var(--num); font-size:20px; line-height:1.1; font-weight:700; letter-spacing:-0.005em; }
  .rn-rival-party{ margin:1px 0 0; font-size:13px; line-height:1.05; font-variant-caps:all-small-caps; letter-spacing:.03em; color:var(--muted); font-weight:700; max-width:12em; }
  .rn-rival-pct{ margin:4px 0 0; font-family:var(--num); font-size:34px; line-height:1; font-weight:1000; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .rn-rival-votes{ margin:2px 0 0; font-size:12px; color:var(--text); font-variant-numeric:tabular-nums; }

  /* ---------- leyenda (abajo a la derecha del mapa) ---------- */
  .rn-legend{ position:absolute; right:0; bottom:4%; z-index:2; font-size:11.5px; pointer-events:none; }
  .rn-legend .lg-title{ font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:#000; margin-bottom:6px; }
  .lg-scale{ display:grid; grid-template-columns:repeat(3, 34px); gap:3px; }
  .lg-scale .sw{ height:9px; }
  .lg-ticks{ position:relative; grid-column:1 / span 3; height:13px; font-size:10.5px; font-weight:600; margin-top:1px; }
  .lg-ticks span{ position:absolute; transform:translateX(-50%); top:0; }
  .rn-legend .lg-item{ display:flex; align-items:center; gap:6px; font-weight:500; margin-top:6px; }
  .rn-legend .lg-shape{ flex:none; width:11px; height:11px; border-radius:2px; }

  /* ---------- mapa ---------- */
  .rn-map-wrap{ position:relative; max-width:440px; margin:25px auto 0; }
  .rn-map-wrap svg{ display:block; width:100%; height:auto; overflow:visible; user-select:none; -webkit-user-select:none; }
  .rn-state{ stroke:#fff; stroke-width:2.2; stroke-linejoin:round; cursor:pointer; transition:fill .4s ease; outline:none; }
  .rn-state:hover{ stroke:var(--black); stroke-width:2.2; }
  .rn-state.is-active{ stroke:var(--black); stroke-width:3.4; }
  .rn-state:focus-visible{ stroke:var(--gray-focus); stroke-width:4; }
  .rn-lbl{ font-family:'Chivo',sans-serif; font-weight:600; font-size:22px; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
  .rn-lbl.out{ text-anchor:start; fill:var(--text); }
  .rn-callout{ stroke:var(--text); stroke-width:1.4; fill:none; }

  /* ---------- indicador de interactividad ---------- */
  .rn-hint{ position:absolute; top:30%; left:38%; z-index:6; width:52px; height:52px; pointer-events:none; opacity:1; transition:opacity .35s ease; }
  .rn-hint.is-leaving{ opacity:0; }
  .rn-hint-ping{ position:absolute; inset:0; border-radius:50%; background:rgba(90,90,90,.6); animation:rn-hint-pulse 1.6s ease-in-out infinite; }
  .rn-hint .rn-hint-icon{ position:absolute; left:17.53px; top:13.91px; width:45px; height:auto; z-index:1; }
  @keyframes rn-hint-pulse{ 0%, 100%{ transform:scale(.8); opacity:.55; } 50%{ transform:scale(1.25); opacity:.85; } }

  /* ---------- cartelito / tooltip ---------- */
  .rn-tooltip{
    position:absolute; z-index:7; width:224px; left:0; top:0;
    background:var(--panel); color:var(--text);
    border:1px solid var(--border); border-radius:8px; padding:10px 12px 9px;
    box-shadow:0 10px 26px rgba(20,20,20,0.18);
    opacity:0; pointer-events:none; transition:opacity .1s ease;
  }
  .rn-tooltip.is-open{ opacity:1; }
  .rn-tooltip .tt-title{ font-size:13.5px; font-weight:700; margin-bottom:2px; }
  .rn-tooltip .tt-sub{ font-size:11.5px; color:var(--muted); margin-bottom:6px; }
  .rn-tooltip .tt-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:11.5px; padding:4px 0; border-top:1px solid var(--border); }
  .rn-tooltip .tt-k{ display:flex; align-items:center; gap:6px; }
  .rn-tooltip .tt-k .sw{ width:8px; height:8px; border-radius:2px; flex:none; }
  .rn-tooltip .tt-v{ font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
  .rn-tooltip .tt-v small{ display:block; font-weight:400; color:var(--muted); font-size:10.5px; }
  .rn-tooltip .tt-empty{ font-size:12px; color:var(--muted); }


  /* ---------- pie ---------- */
  .rn-foot{ display:flex; gap:6px 18px; align-items:baseline; justify-content:space-between; padding:10px 0 0; margin-top:20px; border-top:1px solid var(--black); flex-direction:row-reverse; }
  .rn-foot .firma{ display:inline-flex; align-items:center; flex:none; }
  .rn-foot .firma svg{ height:12px; width:auto; display:block; }
  .rn-foot .fuente{ font-size:11px; color:var(--text); }

  /* ---------- selector de elección ---------- */
  .rn-switch{ display:flex; justify-content:center; margin:20px auto 0; width:max-content; max-width:100%; background:var(--bg); border-radius:999px; padding:3px; }
  .rn-switch button{ font:inherit; font-size:13.5px; font-weight:600; color:var(--text); background:none; border:0; border-radius:999px; padding:7px 16px; cursor:pointer; white-space:nowrap; }
  .rn-switch button:hover{ background:#eeeeec; }
  .rn-switch button[aria-pressed="true"]{ background:var(--black); color:#fff; }
  .rn-switch button:focus-visible{ outline:2px solid var(--gray-focus); outline-offset:2px; }

  @media (max-width:640px){
    .rn-duel{ gap:10px; }
    .rn-rival{ flex-direction:column; align-items:flex-start; gap:8px; }
    .rn-photo{ width:76px; height:76px; }
    .rn-legend{ bottom:-1%; }
    .rn-head h1{ font-size:23px; }
    .rn-dek{ font-size:14px; }
    .rn-totals{ gap:2px 22px; font-size:15px; }
    .rn-rival-name{ font-size:18px; }
    .rn-rival-pct{ font-size:30px; }
    .rn-lbl{ font-size:30px; }
  }
  @media (prefers-reduced-motion:reduce){
    .rn-br *{ transition:none !important; }
    .rn-hint-ping{ animation:none; }
  }
</style>
</head>

  var UFS = [["AC","Acre"],["AL","Alagoas"],["AP","Amapá"],["AM","Amazonas"],["BA","Bahia"],["CE","Ceará"],

  /* =====================================================================
     FORMATO (a mano: no depende del idioma instalado en el navegador)
     ===================================================================== */
  function fmtNum(n, dec){
    if (n === null || n === undefined || !isFinite(n)) return "–";
    var parts = Math.abs(n).toFixed(dec || 0).split(".");
    var int = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (n < 0 ? "−" : "") + int + (parts[1] ? "," + parts[1] : "");
  }
  function fmtPct(n, dec){ return n === null || n === undefined ? "–" : fmtNum(n, dec === undefined ? 2 : dec) + " %"; }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  var LOWER = { da:1, de:1, "do":1, das:1, dos:1, e:1 };
  function titleCase(s){
    return String(s || "").toLocaleLowerCase("pt-BR").split(/(\s+)/).map(function(w, i){
      return i > 0 && LOWER[w] ? w : w.charAt(0).toLocaleUpperCase("pt-BR") + w.slice(1);
    }).join("");
  }

  /* =====================================================================
     OBTENCIÓN DE DATOS
     ===================================================================== */
  function tseUrl(scope, i, electionId){
    var c = ELECTION_CONFIG, abr = scope.toLowerCase();
    return c.urlTemplates[i]
      .replace(/\{base\}/g, (c.proxyUrl || c.baseUrl).replace(/\/$/, ""))
      .replace(/\{env\}/g, c.environment).replace(/\{year\}/g, c.year)
      .replace(/\{election6\}/g, ("000000" + electionId).slice(-6))
      .replace(/\{election\}/g, electionId).replace(/\{office\}/g, c.office)
      .replace(/\{abr\}/g, abr);
  }

  function getJSON(url){
    var ctrl = new AbortController();
    var t = setTimeout(function(){ ctrl.abort(); }, ELECTION_CONFIG.timeout);
    return fetch(url, { cache: "no-cache", signal: ctrl.signal }).then(function(res){
      clearTimeout(t);
      if (!res.ok) { var e = new Error("HTTP " + res.status + " en " + url); e.httpStatus = res.status; throw e; }
      return res.json();
    }, function(err){
      clearTimeout(t);
      var e = new Error(err.name === "AbortError" ? "el TSE no respondió a tiempo" : "el navegador no pudo leer " + url);
      e.network = true;
      throw e;
    });
  }

  function fetchScope(scope, st){
    var n = ELECTION_CONFIG.urlTemplates.length;
    function attempt(k, lastErr){
      if (k >= n) return Promise.reject(lastErr);
      var i = (st.tpl + k) % n;
      return getJSON(tseUrl(scope, i, st.id)).then(function(raw){
        st.tpl = i;
        return parseTSE(raw, scope);
      }, function(e){
        if (e.httpStatus === 404) return attempt(k + 1, e); // esa ruta no existe: probar la siguiente
        throw e;
      });
    }
    return attempt(0, null);
  }

  /* =====================================================================
     PARSER DEL TSE (layout EA20 "-u.json" y simplificado "-r.json")
     ===================================================================== */
  function num(v){
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return isFinite(v) ? v : null;
    var s = String(v).trim();
    if (s.indexOf(",") >= 0) s = s.replace(/\./g, "").replace(",", ".");
    var n = Number(s);
    return isFinite(n) ? n : null;
  }
  function pct(o, k){ if (!o) return null; var p = num(o[k + "n"]); return p !== null ? p : num(o[k]); }
  function isoBR(d, t){
    var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(d || ""));
    return m && t ? m[3] + "-" + m[2] + "-" + m[1] + "T" + t + "-03:00" : null;
  }

  function parseTSE(raw, scope){
    if (!raw || typeof raw !== "object") throw new Error("respuesta vacía");
    var legacy = !Array.isArray(raw.carg) && Array.isArray(raw.cand);
    if (!legacy && !Array.isArray(raw.carg)) throw new Error("formato desconocido (claves: " + Object.keys(raw).slice(0, 12).join(", ") + ")");
    var uf = String(raw.cdabr || scope).toUpperCase();
    if (uf !== scope.toUpperCase()) throw new Error("pedí " + scope + " y llegó " + uf);

    var cands = [];
    function push(c, partido){
      if (String(c.dvt || "Válido").toLowerCase().indexOf("anulado") === 0) return;
      cands.push({ numero: num(c.n), nome: c.nmu || c.nm || ("Candidato " + c.n), partido: partido,
        votos: num(c.vap), porcentagem: pct(c, "pvap"), status: c.st || null, eleito: c.e === "s", seq: num(c.seq) });
    }
    if (legacy) {
      raw.cand.forEach(function(c){ push(c, String(c.cc || "").split(" - ")[0].trim() || null); });
    } else {
      var cargo = raw.carg.filter(function(c){ return num(c.cd) === Number(ELECTION_CONFIG.office); })[0] || raw.carg[0];
      (cargo && cargo.agr || []).forEach(function(a){ (a.par || []).forEach(function(p){ (p.cand || []).forEach(function(c){ push(c, p.sg || null); }); }); });
    }
    cands.sort(function(a, b){ return ((b.votos || -1) - (a.votos || -1)) || ((a.seq || 999) - (b.seq || 999)); });

    var s = legacy ? { ts: raw.s, st: raw.st, pst: raw.pst, pstn: raw.pstn } : (raw.s || {});
    var v = legacy ? raw : (raw.v || {});
    var publicados = raw.dv !== "n";
    var a = cands[0], b = cands[1];
    var lider = publicados && a && a.votos > 0 && (!b || a.votos > b.votos);
    return {
      uf: uf, estado: UF_NAMES[uf] || uf, turno: num(raw.t),
      apurado: pct(s, "pst"),
      votosPublicados: publicados, final: raw.tf === "s", definido: raw.md || null,
      total: num(v.tv), validos: num(v.vv),
      totalizacao: isoBR(raw.dt, raw.ht), hora: raw.ht || null,
      candidatos: cands,
      lider: lider ? a : null,
      empate: !!(publicados && a && b && a.votos > 0 && a.votos === b.votos)
    };
  }

  /* =====================================================================
     ESTADO
     ===================================================================== */
  // Un estado por elección: al cambiar con el selector, lo ya descargado se muestra al instante.
  function newState(key){
    return { key: key, id: ELECTION_CONFIG.elections[key], tpl: 0, national: null, ufs: {},
             lastOk: null, lastError: null, running: false, lastRun: 0 };
  }
  var states = { "2t": newState("2t"), "1t": newState("1t") };
  var current = ELECTION_CONFIG.defaultElection, state = states[current], selected = null;

  function apply(state, outcomes){
    var anyOk = false, brFailed = false;
    outcomes.forEach(function(o){
      if (!o.ok) { if (o.scope === "br") { brFailed = true; state.lastError = o.error; } return; }
      anyOk = true;
      if (o.scope === "br") state.national = o.data; else state.ufs[o.scope.toUpperCase()] = o.data;
    });
    if (!anyOk && outcomes.length) state.lastError = outcomes[0].error;
    state.lastOk = anyOk && !brFailed;
  }

  /* =====================================================================
     CANDIDATOS DESTACADOS Y COLORES
     ===================================================================== */
  function destacadoOf(c){
    if (!c) return null;
    for (var i = 0; i < EDITORIAL.destacados.length; i++) {
      var d = EDITORIAL.destacados[i];
      if (c.numero === d.numero || (d.partido && c.partido === d.partido)) return d;
    }
    return null;
  }
  function findInResult(d, r){
    if (!r) return null;
    for (var i = 0; i < r.candidatos.length; i++) { if (destacadoOf(r.candidatos[i]) === d) return r.candidatos[i]; }
    return null;
  }
  function nameOf(c){ var d = destacadoOf(c); return d ? d.nombre : titleCase(c.nome); }
  var otherColors = {};
  function colorOf(c){
    var d = destacadoOf(c); if (d) return d.color;
    if (!(c.numero in otherColors)) otherColors[c.numero] = EDITORIAL.otrosColores[Object.keys(otherColors).length % EDITORIAL.otrosColores.length];
    return otherColors[c.numero];
  }
  function hasData(r){ return r && r.votosPublicados && r.lider && (r.apurado || 0) >= EDITORIAL.minApurado; }
  function bin(p){ return p >= EDITORIAL.cortes[1] ? 2 : p >= EDITORIAL.cortes[0] ? 1 : 0; }
  function fillOf(r){
    if (r && r.empate && (r.apurado || 0) >= EDITORIAL.minApurado) return EDITORIAL.otroColor;
    if (!hasData(r)) return getComputedStyle(root).getPropertyValue("--nodata").trim() || "#e6e3da";
    var d = destacadoOf(r.lider);
    return d ? d.escala[bin(r.lider.porcentagem || 0)] : EDITORIAL.otroColor;
  }
  function labelColorOn(hex){
    var h = hex.replace("#", "");
    var l = [0, 2, 4].map(function(i){ var v = parseInt(h.substr(i, 2), 16) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2] > 0.2 ? "#141414" : "#ffffff";
  }

  /* =====================================================================
     RENDER
     ===================================================================== */
  var root = document.getElementById("rnBr");
  var $ = function(id){ return document.getElementById(id); };
  function setText(el, t){ if (el && el.textContent !== t) el.textContent = t; }
  function setHTML(el, h){ if (el && el._h !== h) { el.innerHTML = h; el._h = h; } }

  function initStatic(){
    setText($("rnTitle"), EDITORIAL.titulo);
    $("rnDuel").innerHTML = EDITORIAL.destacados.map(function(d, i){
      return '<div class="rn-rival" data-i="' + i + '">' +
        '<div class="rn-photo" style="background:' + d.fondo + ';--w:' + d.fotoAjuste.w + ';--x:' + d.fotoAjuste.x + '"><img src="' + d.foto + '" alt="" width="161" height="225"></div>' +
        '<div><p class="rn-rival-name">' + esc(d.nombre) + '</p><p class="rn-rival-party">' + esc(d.partidoNombre) + '</p>' +
        '<p class="rn-rival-pct" style="color:' + d.color + '">–</p><p class="rn-rival-votes"></p></div></div>';
    }).join("");

    // Leyenda con el mismo formato de la casa: título | divisor | escalas
    var c = EDITORIAL.cortes;
    var rows = EDITORIAL.destacados.map(function(d){
      return d.escala.map(function(col){ return '<span class="sw" style="background:' + col + '"></span>'; }).join("");
    }).join("");
    $("rnLegend").innerHTML =
      '<p class="lg-title">Porcentaje de votos</p>' +
      '<div class="lg-scale">' + rows + '<div class="lg-ticks"><span style="left:0;transform:none">&lt;' + c[0] + '</span>' +
      '<span style="left:' + (34 + 1.5) + 'px">' + c[0] + '</span><span style="left:' + (2 * 34 + 4.5) + 'px">' + c[1] + '</span>' +
      '<span style="right:0;transform:none">+</span></div></div>' +
      '<span class="lg-item" id="rnLgOther" hidden><span class="lg-shape" style="background:' + EDITORIAL.otroColor + '"></span>Otro o empate</span>';

  }

  function renderHead(){
    setText($("rnDek"), EDITORIAL.bajadas[current]);
    Array.prototype.forEach.call(document.querySelectorAll(".rn-switch button"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-e") === current ? "true" : "false");
    });
  }

  function renderNational(){
    var r = state.national;
    if (!r) {
      setText($("rnMesas"), "–"); setText($("rnVotos"), "–");
      Array.prototype.forEach.call(document.querySelectorAll(".rn-rival-pct"), function(el){ setText(el, "–"); });
      Array.prototype.forEach.call(document.querySelectorAll(".rn-rival-votes"), function(el){ setText(el, ""); });
      return;
    }
    setText($("rnMesas"), fmtPct(r.apurado));
    setText($("rnVotos"), fmtNum(r.total !== null ? r.total : r.validos));
    EDITORIAL.destacados.forEach(function(d, i){
      var el = document.querySelector('.rn-rival[data-i="' + i + '"]');
      var c = findInResult(d, r);
      setText(el.querySelector(".rn-rival-pct"), r.votosPublicados && c ? fmtPct(c.porcentagem) : "–");
      setText(el.querySelector(".rn-rival-votes"), r.votosPublicados && c ? fmtNum(c.votos) + " votos" : "");
    });
  }

  function renderStatus(){
    var r = state.national, st = $("rnStatus"), alert = $("rnAlert");
    var hora = r && r.hora ? r.hora : "";
    st.className = "rn-status";
    if (!r) {
      setText(st, state.lastOk === false ? "" : "Cargando resultados del TSE…");
    } else if (state.lastOk === false) {
      setText(st, "Últimos datos disponibles: " + hora.slice(0, 5)); st.classList.add("is-stale");
    } else {
      setText(st, (r.final ? "Resultado final · " : "Actualizado: ") + hora);
    }
    var showAlert = !r && state.lastOk === false;
    alert.hidden = !showAlert;
    if (showAlert) {
      var e = state.lastError || "sin respuesta";
      setText(alert, "No se pudieron leer los datos del TSE: " + e + ". " +
        (/navegador no pudo leer/.test(e) && !ELECTION_CONFIG.proxyUrl
          ? "Probablemente el TSE no permite consultas desde otras páginas (CORS): hay que configurar proxyUrl (ver README)."
          : "Se reintenta cada 20 segundos."));
    }
  }

  function renderMap(){
    var other = false;
    Array.prototype.forEach.call(document.querySelectorAll(".rn-state"), function(p){
      var uf = p.getAttribute("data-uf"), r = state.ufs[uf], f = fillOf(r);
      if (p.getAttribute("fill") !== f) p.setAttribute("fill", f);
      if (f === EDITORIAL.otroColor) other = true;
      var lbl = document.querySelector('.rn-lbl[data-uf="' + uf + '"]:not(.out)');
      if (lbl) lbl.setAttribute("fill", labelColorOn(f));
      p.classList.toggle("is-active", selected === uf);
      p.setAttribute("aria-label", UF_NAMES[uf] + (hasData(r) ? ": lidera " + nameOf(r.lider) + " con " + fmtPct(r.lider.porcentagem, 1) : ": sin datos suficientes"));
    });
    $("rnLgOther").hidden = !other;
    if (selected) {
      var a = document.querySelector('.rn-state[data-uf="' + selected + '"]');
      if (a) a.parentNode.appendChild(a); // al frente, para que se vea el borde completo
    }
  }


  /* ---------- tooltip ---------- */
  var tooltip = $("rnTooltip"), ttBody = $("rnTtBody"), mapWrap = $("rnMapWrap"), svg = mapWrap.querySelector("svg");
  function tooltipHTML(uf){
    var r = state.ufs[uf];
    var head = '<div class="tt-title">' + esc(UF_NAMES[uf]) + '</div>';
    if (!r) return head + '<div class="tt-empty">Sin datos disponibles.</div>';
    head += '<div class="tt-sub">Escrutado: ' + fmtPct(r.apurado, 1) + '</div>';
    if (!r.votosPublicados) return head + '<div class="tt-empty">El TSE todavía no divulga los votos.</div>';
    if (!r.candidatos.length || !(r.apurado > 0)) return head + '<div class="tt-empty">Todavía no hay mesas escrutadas.</div>';
    var shown = r.candidatos.filter(function(c, i){ return i < 2 || destacadoOf(c) || (c.porcentagem || 0) >= 5; }).slice(0, 4);
    var sum = 0;
    var rows = shown.map(function(c){
      sum += c.porcentagem || 0;
      return '<div class="tt-row"><span class="tt-k"><span class="sw" style="background:' + colorOf(c) + '"></span>' + esc(nameOf(c)) + '</span>' +
        '<span class="tt-v">' + fmtPct(c.porcentagem, 1) + '<small>' + fmtNum(c.votos) + ' votos</small></span></div>';
    }).join("");
    if (shown.length < r.candidatos.length) rows += '<div class="tt-row"><span class="tt-k">Otros</span><span class="tt-v">' + fmtPct(Math.max(0, 100 - sum), 1) + '</span></div>';
    return head + rows;
  }

  // El cartel se ubica junto al puntero (o al dedo, o al centro del estado con teclado)
  // y se da vuelta si no entra a la derecha o abajo.
  function placeTooltip(x, y){
    var wrap = mapWrap.getBoundingClientRect();
    var w = tooltip.offsetWidth, h = tooltip.offsetHeight, gap = 14;
    var left = x + gap, top = y + gap;
    if (left + w > wrap.width) left = x - w - gap;
    if (left < 0) left = Math.max(0, Math.min(wrap.width - w, x - w / 2));
    if (top + h > wrap.height) top = Math.max(0, y - h - gap);
    tooltip.style.left = left + "px";
    tooltip.style.top = top + "px";
  }
  function pointInWrap(ev){
    var wrap = mapWrap.getBoundingClientRect();
    return [ev.clientX - wrap.left, ev.clientY - wrap.top];
  }
  function centroidInWrap(uf){
    var p = document.querySelector('.rn-state[data-uf="' + uf + '"]');
    var vb = svg.viewBox.baseVal, rect = svg.getBoundingClientRect(), wrap = mapWrap.getBoundingClientRect();
    var k = rect.width / vb.width;
    return [(+p.getAttribute("data-cx")) * k + (rect.left - wrap.left), (+p.getAttribute("data-cy")) * k + (rect.top - wrap.top)];
  }
  function openTooltip(uf, x, y){
    if (selected !== uf || !tooltip.classList.contains("is-open")) {
      selected = uf;
      ttBody.innerHTML = tooltipHTML(uf);
      tooltip.classList.add("is-open");
      renderMap();
    }
    placeTooltip(x, y);
    dismissHint();
  }
  function closeTooltip(){
    if (!selected) return;
    tooltip.classList.remove("is-open");
    selected = null;
    renderMap();
  }

  var hint = $("rnHint");
  function dismissHint(){
    if (!hint) return;
    var el = hint; hint = null;
    el.classList.add("is-leaving");
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 350);
  }
  setTimeout(dismissHint, 6000);

  function bindEvents(){
    Array.prototype.forEach.call(document.querySelectorAll(".rn-state"), function(p){
      var uf = p.getAttribute("data-uf");
      // Mouse: el cartel acompaña al puntero mientras está sobre el estado.
      p.addEventListener("pointermove", function(ev){
        if (ev.pointerType !== "mouse") return;
        var pt = pointInWrap(ev); openTooltip(uf, pt[0], pt[1]);
      });
      p.addEventListener("pointerleave", function(ev){ if (ev.pointerType === "mouse") closeTooltip(); });
      // Touch: tocar un estado muestra el cartel; tocar afuera lo cierra.
      p.addEventListener("pointerup", function(ev){
        if (ev.pointerType === "mouse") return;
        ev.stopPropagation();
        var pt = pointInWrap(ev); openTooltip(uf, pt[0], pt[1]);
      });
      // Teclado
      p.addEventListener("focus", function(){ var c = centroidInWrap(uf); openTooltip(uf, c[0], c[1]); });
      p.addEventListener("blur", closeTooltip);
    });
    document.addEventListener("pointerup", function(ev){
      if (ev.pointerType !== "mouse" && !ev.target.closest(".rn-state")) closeTooltip();
    });
    document.addEventListener("keydown", function(ev){ if (ev.key === "Escape") closeTooltip(); });
  }

  /* =====================================================================
     ACTUALIZACIÓN AUTOMÁTICA
     ===================================================================== */
  var timer = null;

  function allFinal(st){
    return st.national && st.national.final && UFS.every(function(u){ var r = st.ufs[u[0]]; return r && r.final; });
  }

  function renderAll(){
    renderHead(); renderNational(); renderMap(); renderStatus();
    if (selected && tooltip.classList.contains("is-open")) ttBody.innerHTML = tooltipHTML(selected);
    postHeight();
  }

  function tick(){
    var st = state;
    if (st.running) return;
    st.running = true; st.lastRun = Date.now();
    Promise.all(SCOPES.map(function(s){
      return fetchScope(s, st).then(function(d){ return { scope: s, ok: true, data: d }; },
                                    function(e){ return { scope: s, ok: false, error: e.message }; });
    })).then(function(outcomes){
      apply(st, outcomes);
      var failed = outcomes.filter(function(o){ return !o.ok; });
      if (failed.length) console.warn("[TSE " + st.id + "] Fallaron:", failed.map(function(o){ return o.scope + " (" + o.error + ")"; }).join(", "));
    }).catch(function(e){
      st.lastOk = false; st.lastError = e.message;
    }).then(function(){
      st.running = false;
      if (st !== state) return; // se cambió de elección mientras se descargaba: esa tiene su propio ciclo
      renderNational(); renderMap(); renderStatus();
      if (selected && tooltip.classList.contains("is-open")) ttBody.innerHTML = tooltipHTML(selected);
      postHeight();
      clearTimeout(timer);
      if (!allFinal(st)) timer = setTimeout(function loop(){
        if (document.hidden) { timer = setTimeout(loop, ELECTION_CONFIG.updateInterval); return; }
        tick();
      }, ELECTION_CONFIG.updateInterval);
    });
  }
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden && Date.now() - state.lastRun > ELECTION_CONFIG.updateInterval) tick();
  });

  function setElection(key){
    if (key === current || !states[key]) return;
    current = key; state = states[key];
    clearTimeout(timer);
    renderAll();
    if (!allFinal(state)) tick();
  }
  Array.prototype.forEach.call(document.querySelectorAll(".rn-switch button"), function(b){
    b.addEventListener("click", function(){ setElection(b.getAttribute("data-e")); });
  });

  /* ---------- altura para el iframe de WordPress ---------- */
  function postHeight(){
    if (window.parent === window) return;
    window.parent.postMessage({ type: "rn-iframe-height", id: "elecciones-brasil-2026", height: Math.ceil(document.documentElement.scrollHeight) }, "*");
  }
  if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
  window.addEventListener("load", postHeight);

  // Para depurar / exportar desde la consola: __rnBrasil.csv()
  window.__rnBrasil = { states: states, get state(){ return state; }, setElection: setElection, refresh: tick, csv: function(){
    var lines = ["uf,estado,candidato,partido,votos,porcentagem,apurado"];
    [state.national].concat(UFS.map(function(u){ return state.ufs[u[0]]; })).forEach(function(r){
      if (r) r.candidatos.forEach(function(c){ lines.push([r.uf, r.estado, c.nome, c.partido, c.votos, c.porcentagem, r.apurado].map(function(v){ v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(",")); });
    });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" }));
    a.download = "brasil-2026-presidente.csv"; document.body.appendChild(a); a.click(); a.remove();
  } };

  initStatic();
  bindEvents();
  renderHead();
  renderMap();
  tick();
})();
</script>
</body>
</html>
